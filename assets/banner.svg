<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace" role="img" aria-label="Working Poor — budgeting in your terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10151c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3fb950"/>
      <stop offset="1" stop-color="#56d364"/>
    </linearGradient>
  </defs>

  <!-- terminal window -->
  <rect x="0" y="0" width="1200" height="340" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="14" fill="none" stroke="#222b36" stroke-width="1"/>

  <!-- title bar -->
  <rect x="1" y="1" width="1198" height="46" rx="13" fill="#161b22"/>
  <rect x="1" y="30" width="1198" height="17" fill="#161b22"/>
  <circle cx="34" cy="24" r="7" fill="#ff5f56"/>
  <circle cx="58" cy="24" r="7" fill="#ffbd2e"/>
  <circle cx="82" cy="24" r="7" fill="#27c93f"/>
  <text x="600" y="29" text-anchor="middle" fill="#7d8590" font-size="15">workingpoor — ~/budget</text>

  <!-- prompt -->
  <text x="40" y="104" font-size="20" fill="#7d8590">$ <tspan fill="#c9d1d9">workingpoor</tspan></text>

  <!-- title -->
  <text x="40" y="178" font-size="74" font-weight="700" letter-spacing="2" fill="url(#title)">Working Poor</text>

  <!-- subtitle -->
  <text x="44" y="218" font-size="22" fill="#8b949e">budgeting in your terminal · categories · goals · rules · stats</text>

  <!-- faux ledger row -->
  <text x="44" y="282" font-size="19" fill="#6e7681">2026-06-20  Groceries          Food         <tspan fill="#f85149">-58.20</tspan></text>
  <text x="44" y="312" font-size="19" fill="#6e7681">2026-06-19  Paycheck           Income       <tspan fill="#3fb950">+2,400.00</tspan></text>

  <!-- blinking cursor -->
  <rect x="240" y="88" width="12" height="22" fill="#3fb950">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>
</svg>
