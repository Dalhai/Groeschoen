<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" font-family="'JetBrains Mono','Fira Code','SFMono-Regular',Consolas,monospace" role="img" aria-label="Gröschön — budgeting in your terminal">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#10151c"/>
    </linearGradient>
    <linearGradient id="title" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#e8be5a"/>
      <stop offset="1" stop-color="#ffe9a8"/>
    </linearGradient>
    <radialGradient id="coin" cx="0.36" cy="0.30" r="0.85">
      <stop offset="0" stop-color="#ffe9a8"/>
      <stop offset="0.55" stop-color="#e8be5a"/>
      <stop offset="1" stop-color="#b8860b"/>
    </radialGradient>
    <path id="arc-top" d="M 935 175 a 75 75 0 0 1 150 0" fill="none"/>
    <path id="arc-bottom" d="M 1085 175 a 75 75 0 0 1 -150 0" fill="none"/>
  </defs>

  <!-- terminal window -->
  <rect x="0" y="0" width="1200" height="340" rx="14" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1199" height="339" rx="14" fill="none" stroke="#222b36" stroke-width="1"/>

  <!-- title bar -->
  <rect x="1" y="1" width="1198" height="46" rx="13" fill="#161b22"/>
  <rect x="1" y="30" width="1198" height="17" fill="#161b22"/>
  <circle cx="34" cy="24" r="7" fill="#ff5f56"/>
  <circle cx="58" cy="24" r="7" fill="#ffbd2e"/>
  <circle cx="82" cy="24" r="7" fill="#27c93f"/>
  <text x="600" y="29" text-anchor="middle" fill="#7d8590" font-size="15">groeschoen — ~/budget</text>

  <!-- prompt -->
  <text x="40" y="104" font-size="20" fill="#7d8590">$ <tspan fill="#c9d1d9">groeschoen</tspan></text>

  <!-- title -->
  <text x="40" y="180" font-size="74" font-weight="700" letter-spacing="2" fill="url(#title)">Gröschön</text>

  <!-- subtitle -->
  <text x="44" y="220" font-size="22" fill="#8b949e">budgeting in your terminal · categories · goals · rules · stats</text>

  <!-- faux ledger row -->
  <text x="44" y="284" font-size="19" fill="#6e7681">2026-06-20  Groceries          Food         <tspan fill="#f85149">-58.20</tspan></text>
  <text x="44" y="314" font-size="19" fill="#6e7681">2026-06-19  Paycheck           Income       <tspan fill="#3fb950">+2,400.00</tspan></text>

  <!-- blinking cursor -->
  <rect x="240" y="88" width="12" height="22" fill="#e8be5a">
    <animate attributeName="opacity" values="1;1;0;0" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <!-- the Groschen -->
  <g transform="translate(1010,175)">
    <ellipse cx="6" cy="10" rx="98" ry="98" fill="#000000" opacity="0.25"/>
    <circle r="98" fill="url(#coin)" stroke="#8a6d1f" stroke-width="3"/>
    <circle r="98" fill="none" stroke="#caa84a" stroke-width="5" stroke-dasharray="5 6"/>
    <circle r="80" fill="none" stroke="#8a6d1f" stroke-width="2" opacity="0.65"/>
    <text text-anchor="middle" y="22" font-size="84" font-weight="700" fill="#5c4708">10</text>
    <text font-size="17" letter-spacing="4" fill="#6b520c">
      <textPath href="#arc-top" startOffset="50%" text-anchor="middle">G R Ö S C H Ö N</textPath>
    </text>
    <text font-size="16" letter-spacing="6" fill="#6b520c">
      <textPath href="#arc-bottom" startOffset="50%" text-anchor="middle">★  PFENNIG  ★</textPath>
    </text>
  </g>
</svg>
